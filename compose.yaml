name: ai-hitung-hpp

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hpp}
      POSTGRES_USER: ${POSTGRES_USER:-hpp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      HPP_ENVIRONMENT: ${HPP_ENVIRONMENT:-development}
      HPP_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-hpp_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hpp}"
      HPP_DATABASE_COMMAND_TIMEOUT_SECONDS: ${HPP_DATABASE_COMMAND_TIMEOUT_SECONDS:-10}
      HPP_SECRET_KEY: ${HPP_SECRET_KEY:?Set HPP_SECRET_KEY in .env}
      HPP_API_V1_PREFIX: /api/v1
      HPP_SESSION_COOKIE_NAME: hpp_session
      HPP_SESSION_COOKIE_SECURE: "false"
      HPP_SESSION_COOKIE_HTTPONLY: "true"
      HPP_SESSION_COOKIE_SAMESITE: lax
      HPP_SESSION_COOKIE_MAX_AGE_SECONDS: 604800
      HPP_PASSWORD_RESET_TOKEN_MAX_AGE_SECONDS: 3600
      HPP_CORS_ALLOWED_ORIGINS: '${HPP_CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}'
      HPP_CORS_ALLOW_CREDENTIALS: "true"
      HPP_CURRENCY: IDR
      HPP_MEDIA_ROOT: /app/media
      HPP_PRODUCT_IMAGE_MAX_BYTES: ${HPP_PRODUCT_IMAGE_MAX_BYTES:-5242880}
      HPP_RATE_LIMIT_BACKEND: memory
      HPP_RATE_LIMIT_WINDOW_SECONDS: 60
      HPP_RATE_LIMIT_REQUESTS: 60
      HPP_RATE_LIMIT_LOGIN_REQUESTS: 5
      HPP_RATE_LIMIT_AI_REQUESTS: ${HPP_RATE_LIMIT_AI_REQUESTS:-20}
      HPP_RATE_LIMIT_AI_DAILY_BUSINESS_REQUESTS: ${HPP_RATE_LIMIT_AI_DAILY_BUSINESS_REQUESTS:-100}
      HPP_RATE_LIMIT_AI_DAILY_IP_REQUESTS: ${HPP_RATE_LIMIT_AI_DAILY_IP_REQUESTS:-200}
      HPP_RATE_LIMIT_REGISTER_REQUESTS: ${HPP_RATE_LIMIT_REGISTER_REQUESTS:-3}
      HPP_RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${HPP_RATE_LIMIT_REGISTER_WINDOW_SECONDS:-86400}
      HPP_TRUSTED_PROXY_CIDRS: ${HPP_TRUSTED_PROXY_CIDRS:-[]}
      HPP_CLIENT_IP_HEADER: ${HPP_CLIENT_IP_HEADER:-x-forwarded-for}
      HPP_OPENROUTER_ALLOW_PAID_MODELS: ${HPP_OPENROUTER_ALLOW_PAID_MODELS:-false}
      HPP_OPENROUTER_MODEL: ${HPP_OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      HPP_OPENROUTER_BASE_URL: ${HPP_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      HPP_OPENROUTER_HTTP_REFERER: ${HPP_OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      HPP_OPENROUTER_APP_TITLE: ${HPP_OPENROUTER_APP_TITLE:-HPP Pintar}
      HPP_OPENROUTER_TIMEOUT_SECONDS: ${HPP_OPENROUTER_TIMEOUT_SECONDS:-60}
      HPP_OPENROUTER_MAX_TOKENS: ${HPP_OPENROUTER_MAX_TOKENS:-2000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - product_media:/app/media

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai-hitung-hpp-postgres-data}
  product_media:
    name: ${PRODUCT_MEDIA_VOLUME_NAME:-ai-hitung-hpp-product-media}
