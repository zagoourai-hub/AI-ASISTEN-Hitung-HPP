di design/ dengan spesifikasi teknis di PRD dan AGENTS.md?"]};
    const colorMap = {
      0: '#10b981',
      1: '#3b82f6',
      2: '#8b5cf6',
      3: '#f59e0b'
    };
    const nodeCommMap = {};
    Object.entries(graph.communities).forEach(([commId, nodeIds]) => {
      nodeIds.forEach(id => nodeCommMap[id] = parseInt(commId));
    });

    const svg = d3.select("svg"),
          width = window.innerWidth,
          height = window.innerHeight;

    const g = svg.append("g");
    svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => g.attr("transform", e.transform)));

    const simulation = d3.forceSimulation(graph.nodes)
      .force("link", d3.forceLink(graph.edges).id(d => d.id).distance(120))
      .force("charge", d3.forceManyBody().strength(-350))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(30));

    const link = g.append("g")
      .attr("class", "links")
      .selectAll("line")
      .data(graph.edges)
      .enter().append("line")
      .attr("class", "link");

    const node = g.append("g")
      .attr("class", "nodes")
      .selectAll("g")
      .data(graph.nodes)
      .enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

    node.append("circle")
      .attr("r", d => d.file_type === 'concept' ? 10 : d.file_type === 'document' ? 12 : 8)
      .attr("fill", d => colorMap[nodeCommMap[d.id] ?? 0])
      .attr("stroke", "#ffffff")
      .attr("stroke-width", 1.5);

    node.append("text")
      .attr("dx", 14)
      .attr("dy", ".35em")
      .text(d => d.label);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      node
        .attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
  </script>
